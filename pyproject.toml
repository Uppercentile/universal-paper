[project]
name = "universal-paper"
version = "0.1.0.dev0"
description = "Reference interpreter for Universal Paper, a first-order language for GPO agreements"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
up = "universal_paper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
