name: Release

# Publishes a version when a tag like v0.1.0 is pushed (or a GitHub Release creates one):
#   1. checks that the tag matches every version number and that the tests pass,
#   2. builds universal-paper and universal-paper-mcp,
#   3. publishes both to PyPI with trusted publishing (no tokens; set up once on pypi.org),
#   4. publishes server.json to the official MCP Registry as io.github.Uppercentile/universal-paper
#      (GitHub OIDC; no tokens).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches every version number
        run: |
          v="${GITHUB_REF_NAME#v}"
          python - "$v" <<'PY'
          import json, sys, tomllib
          v = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "packages/universal-paper-mcp/pyproject.toml": tomllib.load(open("packages/universal-paper-mcp/pyproject.toml", "rb"))["project"]["version"],
              "server.json": json.load(open("server.json"))["version"],
              "server.json packages[0]": json.load(open("server.json"))["packages"][0]["version"],
          }
          bad = {k: x for k, x in found.items() if x != v}
          if bad:
              sys.exit(f"tag v{v} does not match: {bad}")
          print("all versions are", v)
          PY
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest -q
      - name: Build both packages
        run: |
          python -m build --outdir dist .
          python -m build --outdir dist packages/universal-paper-mcp
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/universal-paper-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the package on PyPI
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/universal-paper-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "universal-paper-mcp $v is not on PyPI yet" && exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
